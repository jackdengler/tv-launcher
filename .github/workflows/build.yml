name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease -PversionCode=${{ github.run_number }}

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk quiet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quiet-apk
          path: quiet.apk

      - name: Publish release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Move the tag to this commit, then replace the asset in place so the
          # download URL keeps working (never a window with no release).
          git tag -f latest
          git push -f origin refs/tags/latest
          notes="Build ${{ github.run_number }} from ${GITHUB_SHA::7}"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest quiet.apk --clobber
            gh release edit latest --title "Quiet (build ${{ github.run_number }})" --notes "$notes" --latest
          else
            gh release create latest quiet.apk --title "Quiet (build ${{ github.run_number }})" --notes "$notes" --latest
          fi
